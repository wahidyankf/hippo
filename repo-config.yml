# schema: rhino/repo-config/v1
#
# What this repository enforces about its own documentation, declared rather
# than compiled in. HIPPO had no validator before RHINO, so nothing here is a
# transcription of prior behaviour -- every value is taken from a rule this
# repository already wrote down or a convention its tree already keeps, and
# where it has neither, the list is empty rather than filled with a guess.

governance-word-budget:
  # Inert, and deliberately so. HIPPO's contributor rules require its
  # documentation to stay true to the shipped binary; they set no length limit
  # on anything. An empty surface list says that in the schema's own terms --
  # nothing is budgeted -- rather than importing a sibling repository's number
  # and enforcing a policy this repository never adopted.
  count: whitespace-separated
  surfaces: []

governance-directory-map:
  # `specs/` is the one tree here that keeps directory maps, and it keeps them
  # in both of its READMEs. `docs/` is excluded on purpose: its READMEs are
  # Diátaxis landing pages that link into their sections by name, which is a
  # different contract from naming every direct sibling exactly once, and
  # declaring it would impose a rule this repository never adopted.
  trees:
    - path: specs

md-internal-link:
  exclude-sources: []

md-mermaid:
  # Okabe-Ito, chosen because it stays distinguishable under the common forms
  # of colour blindness. `#029E73` reaches only 3.42:1 against white, so it
  # carries black text; the validator enforces the pairing rather than trusting
  # whoever adds the next diagram to remember it.
  node-label-graphemes: 32
  edge-label-graphemes: 24
  fill-colors:
    - "#0173B2"
    - "#DE8F05"
    - "#029E73"
    - "#CA9161"
  edge-colors:
    - "#0173B2"
    - "#000000"
  text-colors:
    - "#000000"
    - "#FFFFFF"

harness-parity:
  # HIPPO has one always-on instruction body and no coding-harness adapters of
  # any kind -- no CLAUDE.md, no .agents/, no .claude/. The roster is empty and
  # says so; the prohibition below does not weaken because of it, which is the
  # whole point of checking a repository that has nothing to reconcile.
  canonical:
    instruction: AGENTS.md
  harnesses: []
  prohibited-instruction-sources:
    - "**/CLAUDE.md"
    - "**/AGENTS.override.md"
    - ".cursorrules"
  capabilities: []
  constraints: []

scan:
  exclude-directories:
    - .git
    - .husky
    - node_modules
    - dist
    - coverage
    - local-tmp
    - generated-reports
