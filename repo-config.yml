# yaml-language-server: $schema=https://raw.githubusercontent.com/wahidyankf/rhino/v0.7.0/schemas/repo-config/v2.schema.json
# HIPPO owns this consumer policy. RHINO owns the schema and renderer; the
# repository declares only its lifecycle, canonical harness, and validators.

schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - .husky
    - node_modules
    - dist
    - coverage
    - local-tmp
    - generated-reports
    - worktrees

harness:
  canonical:
    agents:
      name: name
      description: description
      tier: tier
      grants: requires
      denials: denies
      constraints: constraints
    skills:
      name: name
      description: description
  requirements:
    capabilities:
      - repository-read
      - repository-write
      - shell
    constraints:
      - inline-result-only
    routes:
      - canonical-import
    identities:
      - description
  profiles:
    - id: claude
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
        constraints:
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      instruction-adapter:
        path: CLAUDE.md
        route: "@{path}"
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        tier-fields: { model: model, effort: effort }
        translations:
          - { when: always, field: tools, members: [Read] }
          - {
              when: requires,
              capability: repository-read,
              field: tools,
              members: [Glob, Grep],
            }
          - {
              when: requires,
              capability: repository-write,
              field: tools,
              members: [Write, Edit],
            }
          - { when: requires, capability: shell, field: tools, members: [Bash] }
          - {
              when: denies,
              capability: repository-write,
              field: tools,
              absent-members: [Write, Edit],
            }
          - {
              when: denies,
              capability: shell,
              field: tools,
              absent-members: [Bash, PowerShell],
            }
          - {
              when: denies,
              capability: nested-agent,
              field: tools,
              absent-members: [Agent, Task],
            }
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        route: "Read {path} completely, resolve every relative resource from that skill directory, and follow it as authoritative before acting."
        identity: { name: name, description: description }
      tiers:
        plan: { model: opus, effort: high }
    - id: codex
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
        constraints:
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        absent: [model, effort]
    - id: opencode
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
        constraints:
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path {path} and follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { description: description }
        fixed: { mode: subagent }
        translations:
          - { when: always, field: permission, entries: { read: allow } }
          - {
              when: requires,
              capability: repository-read,
              field: permission,
              entries: { glob: allow, grep: allow },
            }
          - {
              when: requires,
              capability: repository-write,
              field: permission,
              entries: { edit: allow },
            }
          - {
              when: requires,
              capability: shell,
              field: permission,
              entries: { bash: allow },
            }
          - {
              when: denies,
              capability: repository-write,
              field: permission,
              entries: { edit: deny },
            }
          - {
              when: denies,
              capability: shell,
              field: permission,
              entries: { bash: deny },
            }
          - {
              when: denies,
              capability: nested-agent,
              field: permission,
              entries: { task: deny },
            }

policies:
  markdown:
    internal-link:
      exclude-sources:
        - "specs/fixtures/**"
        - "plans/done/**"
    mermaid:
      node-label-graphemes: 32
      edge-label-graphemes: 24
      fill-colors: ["#0173B2", "#DE8F05", "#029E73", "#CA9161"]
      edge-colors: ["#0173B2", "#000000"]
      text-colors: ["#000000", "#FFFFFF"]
  governance:
    word-budget:
      count: letters-and-digits
      surfaces:
        - { glob: "AGENTS.md", fail: 650, warn: 550 }
        - { glob: "README.md", fail: 1600, warn: 1400 }
        - { glob: "repo-governance/**/*.md", fail: 750, warn: 650 }
    directory-map:
      trees:
        - { path: plans }
        - { path: specs/behaviours }
        - { path: repo-governance }

gates:
  composition:
    pull-request: { relation: at-least }
  entries:
    - id: public-safety-tree
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
      run-on:
        pre-commit: {}
        pull-request: {}
        main: {}
    - id: public-safety-message
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
        environment:
          PUBLIC_SAFETY_MESSAGE: { input: message.text }
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: public-safety-range
      type: check
      inputs:
        range: { kind: commit-range }
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
        environment:
          PUBLIC_SAFETY_BASE: { input: range.base }
          PUBLIC_SAFETY_HEAD: { input: range.head }
      run-on:
        pre-push:
          bind:
            range: { source: push-updates, fallback: refs/remotes/origin/main }
        pull-request:
          bind:
            range: { source: explicit-range, range: explicit }
    - id: public-safety-tests
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/tests/run.sh }]
      run-on:
        pull-request:
          reason: "The scanner regression suite requires an isolated pull-request checkout; local hooks stay bounded."
    - id: format-staged
      type: mutation
      inputs:
        staged: { kind: files }
      mutation: { local: apply-index, ci: verify-clean }
      command:
        executable: bash
        args:
          - { literal: scripts/format-staged.sh }
          - { input: staged.paths, expand: repeat }
      run-on:
        pre-commit:
          bind:
            staged: { source: git-index }
        pull-request:
          bind:
            staged: { source: explicit-range, range: explicit }
    - id: commit-message
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: bash
        args: [{ literal: scripts/check-commit-message.sh }]
        environment:
          RHINO_GATE_MESSAGE: { input: message.text }
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: shell-lint
      type: check
      command:
        executable: sh
        args: [{ literal: scripts/shell-lint.sh }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: quick
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/test-quick.sh }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: repo-config
      type: check
      command:
        executable: ./rhino
        args: [{ literal: repo-config }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: word-budget
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: word-budget },
            { literal: validate },
          ]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: directory-map
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: directory-map },
            { literal: validate },
          ]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: harness-adapters
      type: check
      command:
        executable: ./rhino
        args:
          [{ literal: harness }, { literal: adapters }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: internal-links
      type: check
      command:
        executable: ./rhino
        args:
          [{ literal: md }, { literal: internal-link }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: mermaid
      type: check
      command:
        executable: ./rhino
        args: [{ literal: md }, { literal: mermaid }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }

extensions:
  # Owner: repo-governance/development/quality/stacks/repository-adapter.md
  software-development:
    projects:
      hippo:
        path: .
        kind: app
        stacks: [golang]
      hippo-conformance:
        path: cmd/hippo-conformance
        kind: tooling
        stacks: [golang]
      repo-scripts:
        path: scripts
        kind: tooling
        stacks: [shell]
      public-safety:
        path: scripts/public-safety
        kind: tooling
        stacks: [shell]
