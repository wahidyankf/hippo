# yaml-language-server: $schema=https://raw.githubusercontent.com/wahidyankf/rhino/v0.12.0/schemas/repo-config/v2.schema.json
# HIPPO owns this consumer policy. RHINO owns the schema and renderer; the
# repository declares only its lifecycle, canonical harness, and validators.

schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - .husky
    - node_modules
    - dist
    - coverage
    - local-tmp
    - generated-reports
    - worktrees

harness:
  canonical:
    agents:
      name: name
      description: description
      tier: tier
      grants: capabilities
      denials: denies
      constraints: constraints
      dispatches: dispatches
    skills:
      name: name
      description: description
  requirements:
    capabilities:
      - repository-read
      - repository-write
      - shell
      - network
      - subagent
    constraints:
      - read-only
      - inline-result-only
    routes:
      - canonical-import
    identities:
      - description
  profiles:
    - id: claude
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      instruction-adapter:
        path: CLAUDE.md
        route: "@{path}"
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path\n{path}\nand follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        tier-fields: { model: model, effort: effort }
        dispatches: { field: tools, format: "Agent({names})" }
        empty-tier: { model: inherit }
        translations:
          - { when: always, field: tools, members: [Read] }
          - {
              when: requires,
              capability: repository-read,
              field: tools,
              members: [Glob, Grep],
            }
          - {
              when: requires,
              capability: repository-write,
              field: tools,
              members: [Write, Edit],
            }
          - { when: requires, capability: shell, field: tools, members: [Bash] }
          - {
              when: requires,
              capability: network,
              field: tools,
              members: [WebSearch, WebFetch],
            }
          - {
              when: constrains,
              capability: read-only,
              field: tools,
              absent-members: [Write, Edit],
            }
          # Serena base mappings: ose-rules@cc58f5227238d01995cb581857a91d12170e1ade; local overlays retained.
          - when: requires
            capability: repository-read
            field: tools
            members:
              - mcp__serena__activate_project
              - mcp__serena__initial_instructions
              - mcp__serena__get_current_config
              - mcp__serena__get_symbols_overview
              - mcp__serena__find_symbol
              - mcp__serena__find_referencing_symbols
              - mcp__serena__find_implementations
              - mcp__serena__find_declaration
              - mcp__serena__get_diagnostics_for_file
              - mcp__serena__get_diagnostics_for_symbol
              - mcp__serena__search_for_pattern
              - mcp__serena__read_memory
              - mcp__serena__list_memories
          - when: requires
            capability: repository-write
            field: tools
            members:
              - mcp__serena__replace_symbol_body
              - mcp__serena__insert_after_symbol
              - mcp__serena__insert_before_symbol
              - mcp__serena__rename_symbol
              - mcp__serena__safe_delete_symbol
              - mcp__serena__replace_content
              - mcp__serena__replace_in_files
              - mcp__serena__create_text_file
              - mcp__serena__delete_lines
              - mcp__serena__replace_lines
              - mcp__serena__insert_at_line
              - mcp__serena__write_memory
              - mcp__serena__delete_memory
              - mcp__serena__rename_memory
              - mcp__serena__edit_memory
              - mcp__serena__execute_shell_command
              - mcp__serena__remove_project
          - when: constrains
            capability: read-only
            field: disallowedTools
            members:
              - mcp__serena__replace_symbol_body
              - mcp__serena__insert_after_symbol
              - mcp__serena__insert_before_symbol
              - mcp__serena__rename_symbol
              - mcp__serena__safe_delete_symbol
              - mcp__serena__replace_content
              - mcp__serena__replace_in_files
              - mcp__serena__create_text_file
              - mcp__serena__delete_lines
              - mcp__serena__replace_lines
              - mcp__serena__insert_at_line
              - mcp__serena__write_memory
              - mcp__serena__delete_memory
              - mcp__serena__rename_memory
              - mcp__serena__edit_memory
              - mcp__serena__execute_shell_command
              - mcp__serena__remove_project
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        route: "Read {path} completely,\nresolve every relative resource from that skill directory, and follow it as authoritative before acting."
        identity: { name: name, description: description }
      tiers:
        ultra: {}
        plan: {}
        execution: { model: sonnet, effort: xhigh }
        fast: { model: haiku, effort: xhigh }
    - id: codex
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        route: "Before acting, read the complete canonical agent definition at the repository-root path\n{path}\nand follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        tier-fields: { model: model, effort: model_reasoning_effort }
      tiers:
        ultra: {}
        plan: {}
        execution: {}
        fast:
          model-resolve:
            command: [codex, debug, models]
            pattern: gpt-*-luna
            fallback: gpt-6-luna
          effort: xhigh
    - id: opencode
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path\n{path}\nand follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { description: description }
        fixed: { mode: subagent }
        dispatches: { field: permission.task, format: allow-map }
        translations:
          - { when: always, field: permission, entries: { read: allow } }
          - {
              when: requires,
              capability: repository-read,
              field: permission,
              entries: { glob: allow, grep: allow },
            }
          - {
              when: requires,
              capability: repository-write,
              field: permission,
              entries: { edit: allow },
            }
          - {
              when: requires,
              capability: shell,
              field: permission,
              entries: { bash: allow },
            }
          - {
              when: requires,
              capability: network,
              field: permission,
              entries: { webfetch: allow, websearch: allow },
            }
          - {
              when: constrains,
              capability: read-only,
              field: permission,
              entries: { edit: deny },
            }
          - { when: no-dispatches, field: permission, entries: { task: deny } }
    - id: commandcode
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: .commandcode/agents/{name}.md
        format: front-matter
        route-field: body
        route: |-
          Before acting, read the complete canonical agent definition at the repository-root path
          {path} and follow it as authoritative.
          If it cannot be read, stop and report the missing path.
        identity:
          name: name
          description: description
        agents:
          - ci-checker
          - ci-fixer
          - docs-checker
          - docs-fixer
          - harness-checker
          - harness-fixer
          - plan-checker
          - plan-execution-checker
          - plan-fixer
          - plan-maker
          - pr-review-checker
          - pr-review-fixer
          - rules-checker
          - rules-fixer
          - specs-checker
          - specs-fixer
          - swe-architect
          - swe-debugger
          - swe-developer
          - swe-releaser
          - swe-reviewer
          - swe-usability-tester
        absent:
          - model
          - featureModels
          - effort
          - reasoningEffort
        translations:
          - when: always
            field: tools
            members:
              - read_file
          - when: always
            field: disallowedTools
            members:
              - agent
              - agent_output
          - when: requires
            capability: repository-read
            field: tools
            members:
              - read_directory
              - grep
              - glob
          - when: requires
            capability: repository-write
            field: tools
            members:
              - write_file
              - edit_file
          - when: requires
            capability: shell
            field: tools
            members:
              - shell_command
              - run_command
              - kill_shell
          - when: requires
            capability: network
            field: tools
            members:
              - web_search
              - web_fetch
          - when: constrains
            capability: read-only
            field: disallowedTools
            members:
              - write_file
              - edit_file
          - when: denies
            capability: repository-read
            field: disallowedTools
            members:
              - read_file
              - read_directory
              - grep
              - glob
          - when: denies
            capability: repository-write
            field: disallowedTools
            members:
              - write_file
              - edit_file
          - when: denies
            capability: shell
            field: disallowedTools
            members:
              - shell_command
              - run_command
              - kill_shell
          - when: denies
            capability: network
            field: disallowedTools
            members:
              - web_search
              - web_fetch
          # Serena base mappings: ose-rules@cc58f5227238d01995cb581857a91d12170e1ade; local overlays retained.
          - when: requires
            capability: repository-read
            field: tools
            members:
              - mcp__serena__activate_project
              - mcp__serena__initial_instructions
              - mcp__serena__get_current_config
              - mcp__serena__get_symbols_overview
              - mcp__serena__find_symbol
              - mcp__serena__find_referencing_symbols
              - mcp__serena__find_implementations
              - mcp__serena__find_declaration
              - mcp__serena__get_diagnostics_for_file
              - mcp__serena__get_diagnostics_for_symbol
              - mcp__serena__search_for_pattern
              - mcp__serena__read_memory
              - mcp__serena__list_memories
          - when: requires
            capability: repository-write
            field: tools
            members:
              - mcp__serena__replace_symbol_body
              - mcp__serena__insert_after_symbol
              - mcp__serena__insert_before_symbol
              - mcp__serena__rename_symbol
              - mcp__serena__safe_delete_symbol
              - mcp__serena__replace_content
              - mcp__serena__replace_in_files
              - mcp__serena__create_text_file
              - mcp__serena__delete_lines
              - mcp__serena__replace_lines
              - mcp__serena__insert_at_line
              - mcp__serena__write_memory
              - mcp__serena__delete_memory
              - mcp__serena__rename_memory
              - mcp__serena__edit_memory
              - mcp__serena__execute_shell_command
              - mcp__serena__remove_project
          - when: constrains
            capability: read-only
            field: disallowedTools
            members:
              - mcp__serena__replace_symbol_body
              - mcp__serena__insert_after_symbol
              - mcp__serena__insert_before_symbol
              - mcp__serena__rename_symbol
              - mcp__serena__safe_delete_symbol
              - mcp__serena__replace_content
              - mcp__serena__replace_in_files
              - mcp__serena__create_text_file
              - mcp__serena__delete_lines
              - mcp__serena__replace_lines
              - mcp__serena__insert_at_line
              - mcp__serena__write_memory
              - mcp__serena__delete_memory
              - mcp__serena__rename_memory
              - mcp__serena__edit_memory
              - mcp__serena__execute_shell_command
              - mcp__serena__remove_project
policies:
  markdown:
    metadata:
      surfaces:
        - glob: ".agents/skills/*/SKILL.md"
          schema: skill
        - glob: ".agents/agents/*.md"
          schema: agent
        - glob: ".agents/agents/README.md"
          schema: governance
    internal-link:
      exclude-sources:
        - "specs/fixtures/**"
        - "plans/done/**"
    mermaid:
      authoring-rule: plain-text
      node-label-graphemes: 32
      edge-label-graphemes: 24
      fill-colors: ["#0173B2", "#DE8F05", "#029E73", "#CA9161"]
      edge-colors: ["#0173B2", "#000000"]
      text-colors: ["#000000", "#FFFFFF"]
  governance:
    word-budget:
      count: letters-and-digits
      surfaces:
        - { glob: "AGENTS.md", fail: 650, warn: 550 }
        - { glob: "README.md", fail: 1600, warn: 1400 }
        - { glob: "repo-governance/**/*.md", fail: 750, warn: 650 }
    directory-map:
      trees:
        - { path: plans }
        - { path: specs/behaviours }
        - { path: repo-governance }
    # Owner: repo-governance/development/workflow/quality-gate-adapter.md
    quality-gates:
      root: repo-governance/workflows
      agents: .agents/agents
      groups: [plan, quality, maintenance]
      gate-group: quality
      gate-headings:
        - Entry
        - Inputs
        - Deterministic Boundary
        - Cycle
        - Termination
        - Verdict
        - Ledger
      verdict-heading: Verdict
      verdicts: [PASS, PASS_WITH_FINDINGS, FAIL, BLOCKED]
      retired-inputs: [max-iterations, min-iterations, max-audits]
      propagation-headings:
        - Contract
        - Scope
        - Executor
        - Row Verification
        - Family Rules
      defaults:
        mode: normal
        max-cycles: 3
      gates:
        - family: plan
        - family: docs
        - family: rules
        - family: harness
        - family: ci
        - family: pr-review
        - family: specs

gates:
  composition:
    pull-request: { relation: at-least }
  entries:
    - id: public-safety-tree
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
      run-on:
        pre-commit: {}
        pull-request: {}
        main: {}
    - id: public-safety-message
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
        environment:
          PUBLIC_SAFETY_MESSAGE: { input: message.text }
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: public-safety-range
      type: check
      inputs:
        range: { kind: commit-range }
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
        environment:
          PUBLIC_SAFETY_BASE: { input: range.base }
          PUBLIC_SAFETY_HEAD: { input: range.head }
      run-on:
        pre-push:
          bind:
            range: { source: push-updates, fallback: refs/remotes/origin/main }
        pull-request:
          bind:
            range: { source: explicit-range, range: explicit }
    - id: public-safety-tests
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/tests/run.sh }]
      run-on:
        pull-request:
          reason: "The scanner regression suite requires an isolated pull-request checkout; local hooks stay bounded."
    - id: leak-review-tests
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/leak-review/tests/run.sh }]
      run-on:
        pull-request:
          reason: "The record check's offline suite runs where the hosted check is defined."
        main: {}
    - id: format-staged
      type: mutation
      inputs:
        staged: { kind: files }
      mutation: { local: apply-index, ci: verify-clean }
      command:
        executable: bash
        args:
          - { literal: scripts/format-staged.sh }
          - { input: staged.paths, expand: repeat }
      run-on:
        pre-commit:
          bind:
            staged: { source: git-index }
        pull-request:
          bind:
            staged: { source: explicit-range, range: explicit }
    - id: commit-message
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: bash
        args: [{ literal: scripts/check-commit-message.sh }]
        environment:
          RHINO_GATE_MESSAGE: { input: message.text }
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: shell-lint
      type: check
      command:
        executable: sh
        args: [{ literal: scripts/shell-lint.sh }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: quick
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/test-quick.sh }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: markdown-line-length
      type: check
      command:
        executable: sh
        args: [{ literal: scripts/check-markdown-line-length.sh }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: repo-config
      type: check
      command:
        executable: ./rhino
        args: [{ literal: repo-config }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: word-budget
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: word-budget },
            { literal: validate },
          ]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: quality-gates
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: quality-gates },
            { literal: validate },
          ]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: directory-map
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: directory-map },
            { literal: validate },
          ]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: harness-adapters
      type: check
      command:
        executable: ./rhino
        args:
          - literal: harness
          - literal: adapters
          - literal: validate
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: internal-links
      type: check
      command:
        executable: ./rhino
        args:
          [{ literal: md }, { literal: internal-link }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }
    - id: mermaid
      type: check
      command:
        executable: ./rhino
        args: [{ literal: md }, { literal: mermaid }, { literal: validate }]
      run-on: { pre-push: {}, pull-request: {}, main: {} }

extensions:
  # Owner: repo-governance/development/quality/stacks/repository-adapter.md
  software-development:
    projects:
      hippo:
        path: .
        kind: app
        stacks: [golang]
      hippo-conformance:
        path: cmd/hippo-conformance
        kind: tooling
        stacks: [golang]
      repo-scripts:
        path: scripts
        kind: tooling
        stacks: [shell]
      public-safety:
        path: scripts/public-safety
        kind: tooling
        stacks: [shell]
