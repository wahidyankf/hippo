# yaml-language-server: $schema=https://raw.githubusercontent.com/wahidyankf/rhino/v0.19.0/schemas/repo-config/v2.schema.json
# HIPPO owns this consumer policy. RHINO owns the schema and renderer; the
# repository declares only its lifecycle, canonical harness, and validators.

schema: rhino/repo-config/v2

repository: {}

scan:
  exclude-directories:
    - .git
    - .husky
    - node_modules
    - dist
    - coverage
    - local-tmp
    - generated-reports
    - worktrees

harness:
  agents-root: agents
  canonical:
    agents:
      name: name
      description: description
      tier: tier
      grants: capabilities
      denials: denies
      constraints: constraints
      dispatches: dispatches
    skills:
      name: name
      description: description
  requirements:
    capabilities:
      - repository-read
      - repository-write
      - shell
      - network
      - subagent
    constraints:
      - read-only
      - inline-result-only
    routes:
      - canonical-import
    identities:
      - description
  profiles:
    - id: claude
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      instruction-adapter:
        path: CLAUDE.md
        route: "@{path}"
      agent-adapter:
        path: ".claude/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path\n{path}\nand follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        tier-fields: { model: model, effort: effort }
        dispatches: { field: tools, format: "Agent({names})" }
        empty-tier: { model: inherit }
        translations:
          - { when: always, field: tools, members: [Read] }
          - {
              when: requires,
              capability: repository-read,
              field: tools,
              members: [Glob, Grep],
            }
          - {
              when: requires,
              capability: repository-write,
              field: tools,
              members: [Write, Edit],
            }
          - { when: requires, capability: shell, field: tools, members: [Bash] }
          - {
              when: requires,
              capability: network,
              field: tools,
              members: [WebSearch, WebFetch],
            }
          - {
              when: constrains,
              capability: read-only,
              field: tools,
              absent-members: [Write, Edit],
            }
          # Serena base mappings: ose-rules@cc58f5227238d01995cb581857a91d12170e1ade; local overlays retained.
          - when: requires
            capability: repository-read
            field: tools
            members:
              - mcp__serena__activate_project
              - mcp__serena__initial_instructions
              - mcp__serena__get_current_config
              - mcp__serena__get_symbols_overview
              - mcp__serena__find_symbol
              - mcp__serena__find_referencing_symbols
              - mcp__serena__find_implementations
              - mcp__serena__find_declaration
              - mcp__serena__get_diagnostics_for_file
              - mcp__serena__get_diagnostics_for_symbol
              - mcp__serena__search_for_pattern
              - mcp__serena__read_memory
              - mcp__serena__list_memories
          - when: requires
            capability: repository-write
            field: tools
            members:
              - mcp__serena__replace_symbol_body
              - mcp__serena__insert_after_symbol
              - mcp__serena__insert_before_symbol
              - mcp__serena__rename_symbol
              - mcp__serena__safe_delete_symbol
              - mcp__serena__replace_content
              - mcp__serena__replace_in_files
              - mcp__serena__create_text_file
              - mcp__serena__delete_lines
              - mcp__serena__replace_lines
              - mcp__serena__insert_at_line
              - mcp__serena__write_memory
              - mcp__serena__delete_memory
              - mcp__serena__rename_memory
              - mcp__serena__edit_memory
              - mcp__serena__execute_shell_command
              - mcp__serena__remove_project
          - when: constrains
            capability: read-only
            field: disallowedTools
            members:
              - mcp__serena__replace_symbol_body
              - mcp__serena__insert_after_symbol
              - mcp__serena__insert_before_symbol
              - mcp__serena__rename_symbol
              - mcp__serena__safe_delete_symbol
              - mcp__serena__replace_content
              - mcp__serena__replace_in_files
              - mcp__serena__create_text_file
              - mcp__serena__delete_lines
              - mcp__serena__replace_lines
              - mcp__serena__insert_at_line
              - mcp__serena__write_memory
              - mcp__serena__delete_memory
              - mcp__serena__rename_memory
              - mcp__serena__edit_memory
              - mcp__serena__execute_shell_command
              - mcp__serena__remove_project
      skill-adapter:
        path: ".claude/skills/{name}/SKILL.md"
        format: front-matter
        route-field: body
        route: "Read {path} completely,\nresolve every relative resource from that skill directory, and follow it as authoritative before acting."
        identity: { name: name, description: description }
      tiers:
        ultra: { model: opus, effort: high }
        plan: { model: sonnet, effort: high }
        execution: { model: haiku, effort: high }
        fast: { model: haiku, effort: medium }
    - id: codex
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".codex/agents/{name}.toml"
        format: toml
        route-field: developer_instructions
        route: "Before acting, read the complete canonical agent definition at the repository-root path\n{path}\nand follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { name: name, description: description }
        tier-fields: { model: model, effort: model_reasoning_effort }
      tiers:
        ultra:
          model-resolve:
            command: [codex, debug, models]
            pattern: gpt-*-sol
            fallback: gpt-6-sol
          effort: high
        plan:
          model-resolve:
            command: [codex, debug, models]
            pattern: gpt-*-sol
            fallback: gpt-6-sol
          effort: high
        execution:
          model-resolve:
            command: [codex, debug, models]
            pattern: gpt-*-terra
            fallback: gpt-6.1-terra
          effort: high
        fast:
          model-resolve:
            command: [codex, debug, models]
            pattern: gpt-*-terra
            fallback: gpt-6.1-terra
          effort: medium
    - id: opencode
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".opencode/agents/{name}.md"
        format: front-matter
        route-field: body
        route: "Before acting, read the complete canonical agent definition at the repository-root path\n{path}\nand follow it as authoritative. If it cannot be read, stop and report the missing path."
        identity: { description: description }
        fixed: { mode: subagent }
        dispatches: { field: permission.task, format: allow-map }
        translations:
          - { when: always, field: permission, entries: { read: allow } }
          - {
              when: requires,
              capability: repository-read,
              field: permission,
              entries: { glob: allow, grep: allow },
            }
          - {
              when: requires,
              capability: repository-write,
              field: permission,
              entries: { edit: allow },
            }
          - {
              when: requires,
              capability: shell,
              field: permission,
              entries: { bash: allow },
            }
          - {
              when: requires,
              capability: network,
              field: permission,
              entries: { webfetch: allow, websearch: allow },
            }
          - {
              when: constrains,
              capability: read-only,
              field: permission,
              entries: { edit: deny },
            }
          - { when: no-dispatches, field: permission, entries: { task: deny } }
    - id: commandcode
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: .commandcode/agents/{name}.md
        format: front-matter
        route-field: body
        route: |-
          Before acting, read the complete canonical agent definition at the repository-root path
          {path} and follow it as authoritative.
          If it cannot be read, stop and report the missing path.
        identity:
          name: name
          description: description
        agents:
          - ci-checker
          - ci-fixer
          - docs-checker
          - docs-fixer
          - harness-checker
          - harness-fixer
          - leak-reviewer
          - plan-checker
          - plan-execution-checker
          - plan-fixer
          - plan-maker
          - pr-review-checker
          - pr-review-fixer
          - rules-checker
          - rules-fixer
          - specs-checker
          - specs-fixer
          - swe-architect
          - swe-debugger
          - swe-developer
          - swe-releaser
          - swe-reviewer
          - swe-usability-tester
        absent:
          - model
          - featureModels
          - effort
          - reasoningEffort
        translations:
          - when: always
            field: tools
            members:
              - read_file
          - when: always
            field: disallowedTools
            members:
              - agent
              - agent_output
          - when: requires
            capability: repository-read
            field: tools
            members:
              - read_directory
              - grep
              - glob
          - when: requires
            capability: repository-write
            field: tools
            members:
              - write_file
              - edit_file
          - when: requires
            capability: shell
            field: tools
            members:
              - shell_command
              - run_command
              - kill_shell
          - when: requires
            capability: network
            field: tools
            members:
              - web_search
              - web_fetch
          - when: constrains
            capability: read-only
            field: disallowedTools
            members:
              - write_file
              - edit_file
          - when: denies
            capability: repository-read
            field: disallowedTools
            members:
              - read_file
              - read_directory
              - grep
              - glob
          - when: denies
            capability: repository-write
            field: disallowedTools
            members:
              - write_file
              - edit_file
          - when: denies
            capability: shell
            field: disallowedTools
            members:
              - shell_command
              - run_command
              - kill_shell
          - when: denies
            capability: network
            field: disallowedTools
            members:
              - web_search
              - web_fetch
          # Serena base mappings: ose-rules@cc58f5227238d01995cb581857a91d12170e1ade; local overlays retained.
          - when: requires
            capability: repository-read
            field: tools
            members:
              - mcp__serena__activate_project
              - mcp__serena__initial_instructions
              - mcp__serena__get_current_config
              - mcp__serena__get_symbols_overview
              - mcp__serena__find_symbol
              - mcp__serena__find_referencing_symbols
              - mcp__serena__find_implementations
              - mcp__serena__find_declaration
              - mcp__serena__get_diagnostics_for_file
              - mcp__serena__get_diagnostics_for_symbol
              - mcp__serena__search_for_pattern
              - mcp__serena__read_memory
              - mcp__serena__list_memories
          - when: requires
            capability: repository-write
            field: tools
            members:
              - mcp__serena__replace_symbol_body
              - mcp__serena__insert_after_symbol
              - mcp__serena__insert_before_symbol
              - mcp__serena__rename_symbol
              - mcp__serena__safe_delete_symbol
              - mcp__serena__replace_content
              - mcp__serena__replace_in_files
              - mcp__serena__create_text_file
              - mcp__serena__delete_lines
              - mcp__serena__replace_lines
              - mcp__serena__insert_at_line
              - mcp__serena__write_memory
              - mcp__serena__delete_memory
              - mcp__serena__rename_memory
              - mcp__serena__edit_memory
              - mcp__serena__execute_shell_command
              - mcp__serena__remove_project
          - when: constrains
            capability: read-only
            field: disallowedTools
            members:
              - mcp__serena__replace_symbol_body
              - mcp__serena__insert_after_symbol
              - mcp__serena__insert_before_symbol
              - mcp__serena__rename_symbol
              - mcp__serena__safe_delete_symbol
              - mcp__serena__replace_content
              - mcp__serena__replace_in_files
              - mcp__serena__create_text_file
              - mcp__serena__delete_lines
              - mcp__serena__replace_lines
              - mcp__serena__insert_at_line
              - mcp__serena__write_memory
              - mcp__serena__delete_memory
              - mcp__serena__rename_memory
              - mcp__serena__edit_memory
              - mcp__serena__execute_shell_command
              - mcp__serena__remove_project
    - id: muse
      supports:
        capabilities:
          - repository-read
          - repository-write
          - shell
          - network
          - subagent
        constraints:
          - read-only
          - inline-result-only
        routes:
          - canonical-import
        identities:
          - description
      agent-adapter:
        path: ".agents/agents/{name}/AGENT.md"
        format: front-matter
        route-field: body
        route:
          "Before acting, read the complete canonical agent definition at the repository-root path\n{path} and follow it
          as authoritative.\nIf it cannot be read, stop and report the missing path."
        identity:
          name: name
          description: description
        tier-fields:
          model: model
          effort: effort
      tiers:
        ultra: { model: muse-wonder-1.0, effort: high }
        plan: { model: muse-spark-1.3, effort: xhigh }
        execution: { model: muse-spark-1.3, effort: high }
        fast: { model: muse-spark-1.3, effort: medium }
policies:
  markdown:
    metadata:
      surfaces:
        - glob: ".agents/skills/*/SKILL.md"
          schema: skill
        - glob: "agents/*.md"
          schema: agent
        - glob: "agents/README.md"
          schema: governance
    internal-link:
      exclude-sources:
        - "specs/fixtures/**"
        - "plans/done/**"
    mermaid:
      authoring-rule: rendered
      node-label-graphemes: 32
      edge-label-graphemes: 24
      require-default-class: true
      fill-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      edge-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      text-colors:
        - "#0173B2"
        - "#DE8F05"
        - "#029E73"
        - "#CC78BC"
        - "#CA9161"
        - "#808080"
        - "#000000"
        - "#FFFFFF"
      exclude:
        - "plans/done/**"
        - ".git/**"
        - "**/worktrees/**"
        - "**/node_modules/**"
        - "**/deps/**"
        - "**/coverage/**"
        - "**/playwright-report/**"
        - "**/test-results/**"
  governance:
    word-budget:
      count: letters-and-digits
      surfaces:
        - { glob: "AGENTS.md", fail: 650, warn: 550 }
        - { glob: "README.md", fail: 1600, warn: 1400 }
        - { glob: "repo-governance/**/*.md", fail: 750, warn: 650 }
    directory-map:
      trees:
        - { path: plans }
        - { path: specs/behaviours }
        - { path: repo-governance }
    # Owner: repo-governance/development/workflow/quality-gate-adapter.md
    quality-gates:
      root: repo-governance/workflows
      agents: agents
      groups: [plan, quality, maintenance]
      gate-group: quality
      gate-headings:
        - Entry
        - Inputs
        - Deterministic Boundary
        - Cycle
        - Termination
        - Verdict
        - Ledger
      verdict-heading: Verdict
      verdicts: [PASS, PASS_WITH_FINDINGS, FAIL, BLOCKED]
      retired-inputs: [max-iterations, min-iterations, max-audits]
      propagation-headings:
        - Contract
        - Scope
        - Executor
        - Row Verification
        - Family Rules
      defaults:
        mode: normal
        max-cycles: 3
      gates:
        - family: plan
        - family: docs
        - family: rules
        - family: harness
        - family: ci
        - family: pr-review
        - family: specs
  behaviour:
    corpus:
      - specs/behaviours
    fixtures:
      - specs/fixtures
    levels:
      unit:
        - internal/**/*_test.go
        - cmd/**/*_test.go
        - tests/unit/**/*_test.go
        - tests/bdd/unit_*_test.go
      integration:
        - tests/integration/**/*_test.go
        - tests/bdd/integration_*_test.go
      e2e:
        - tests/e2e/**/*_test.go
        - tests/bdd/e2e_*_test.go
    # The test files of a runner that executes whole feature files, so a
    # `<feature>: *` reference in them covers every scenario of the file (B05).
    whole-file:
      - tests/bdd/unit_*_test.go
      - tests/bdd/integration_*_test.go
      - tests/bdd/e2e_*_test.go

gates:
  composition:
    pull-request: { relation: at-least }
  wiring:
    hooks:
      directory: .husky
    ci:
      directory: .github/workflows
    local-surfaces:
      pre-commit: [format-staged]
      commit-msg: [commit-message]
      pre-push: [public-safety-range]
  entries:
    - id: public-safety-tree
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: public-safety-message
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
        environment:
          PUBLIC_SAFETY_MESSAGE: { input: message.text }
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
          bind:
            message: { source: explicit-range, range: explicit }
    - id: public-safety-range
      type: check
      inputs:
        range: { kind: commit-range }
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/check.sh }]
        environment:
          PUBLIC_SAFETY_BASE: { input: range.base }
          PUBLIC_SAFETY_HEAD: { input: range.head }
      run-on:
        pre-push:
          bind:
            range: { source: push-updates, fallback: refs/remotes/origin/main }
        pull-request:
          bind:
            range: { source: explicit-range, range: explicit }
    - id: public-safety-tests
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/public-safety/tests/run.sh }]
      run-on:
        pull-request:
          reason: "The scanner regression suite requires an isolated pull-request checkout; local hooks stay bounded."
    - id: format-staged
      type: mutation
      inputs:
        staged: { kind: files }
      mutation: { local: apply-index, ci: verify-clean }
      command:
        executable: bash
        args:
          - { literal: scripts/format-staged.sh }
          - { input: staged.paths, expand: repeat }
      run-on:
        pre-commit:
          bind:
            staged: { source: git-index }
        pull-request:
          bind:
            staged: { source: explicit-range, range: explicit }
    - id: commit-message
      type: check
      inputs:
        message: { kind: commit-message }
      command:
        executable: bash
        args: [{ literal: scripts/check-commit-message.sh }]
        environment:
          RHINO_GATE_MESSAGE: { input: message.text }
      run-on:
        commit-msg:
          bind:
            message: { source: hook-message-file }
        pull-request:
          bind:
            message: { source: explicit-range, range: explicit }
    - id: shell-lint
      type: check
      command:
        executable: sh
        args: [{ literal: scripts/shell-lint.sh }]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: remote-dispatch-refusal
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/check-remote-dispatch-refusal.sh }]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: quick
      type: check
      command:
        executable: bash
        args: [{ literal: scripts/test-quick.sh }]
      run-on:
        pull-request:
          reason: "C6: the quick gate runs at pull-request and on main, never in a local hook."
        main:
          reason: "The main surface runs the quick gate after each merge, unfiltered."
    - id: markdown-line-length
      type: check
      command:
        executable: sh
        args: [{ literal: scripts/check-markdown-line-length.sh }]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: repo-config
      type: check
      command:
        executable: ./rhino
        args: [{ literal: repo-config }, { literal: validate }]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: word-budget
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: word-budget },
            { literal: validate },
          ]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: quality-gates
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: quality-gates },
            { literal: validate },
          ]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: directory-map
      type: check
      command:
        executable: ./rhino
        args:
          [
            { literal: governance },
            { literal: directory-map },
            { literal: validate },
          ]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: harness-adapters
      type: check
      command:
        executable: ./rhino
        args:
          - literal: harness
          - literal: adapters
          - literal: validate
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: internal-links
      type: check
      command:
        executable: ./rhino
        args:
          [{ literal: md }, { literal: internal-link }, { literal: validate }]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: mermaid
      type: check
      command:
        executable: ./rhino
        args: [{ literal: md }, { literal: mermaid }, { literal: validate }]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: worktree-layout
      type: check
      command:
        executable: sh
        args: [{ literal: scripts/check-worktree-layout.sh }]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: format-check
      type: check
      command:
        executable: npm
        args: [{ literal: run }, { literal: format:check }]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: hook-transport-tests
      type: check
      command:
        executable: bash
        args:
          - literal: -c
          - literal: "unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_COMMON_DIR GIT_NAMESPACE GIT_PREFIX && bash .commandcode/hooks/agent-policy-selector.test.sh && bash .commandcode/hooks/git-fixture-isolation.test.sh && bash .muse/hooks/run-policy-hook.test.sh && exec bash scripts/agent-hippo-guard.test.sh"
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: architecture-tests
      type: check
      command:
        executable: go
        args:
          [
            { literal: test },
            { literal: -count=1 },
            { literal: ./tests/architecture },
          ]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: contract-tests
      type: check
      command:
        executable: go
        args:
          [
            { literal: test },
            { literal: -race },
            { literal: -count=1 },
            { literal: ./tests/contract },
          ]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: artifact-tests
      type: check
      command:
        executable: sh
        args: [{ literal: tests/artifacts/run.sh }]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: gate-wiring
      type: check
      command:
        executable: ./rhino
        args: [{ literal: gate }, { literal: wiring }, { literal: validate }]
      run-on:
        pull-request:
          reason: "C6: a check outside the local hooks' allowed lists runs at pull-request only."
    - id: test-integration
      type: check
      command:
        executable: npm
        args: [{ literal: run }, { literal: test:integration }]
      run-on:
        pull-request:
          reason: "The integration suites run at pull-request; no local hook runs them."
        main:
          reason: "The integration suites also run on main after each merge."
    - id: test-e2e
      type: check
      command:
        executable: npm
        args: [{ literal: run }, { literal: test:e2e }]
      run-on:
        main:
          reason: "The end-to-end suites run on main, never per pull request."
    - id: vuln-scan
      type: check
      command:
        executable: go
        args: [{ literal: tool }, { literal: govulncheck }, { literal: ./... }]
      run-on:
        main:
          reason: "The vulnerability database is fetched over the network, so the scan runs on main rather than in the offline pull-request gate."

