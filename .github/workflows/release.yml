name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify peeled tag commit on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit=$(git rev-parse "$GITHUB_REF_NAME^{}")
          test "$tag_commit" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$tag_commit" origin/main
      # The full gate runs after merge, so a commit can reach main before its
      # test run has passed. A tag is permanent: refuse to publish until that run
      # passes, and re-run this workflow once it does.
      - name: Require a passing main test run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/main-test.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')
          if [ "${passed}" -lt 1 ]; then
            echo "No passing main-test run exists for $GITHUB_SHA." >&2
            exit 1
          fi
      - name: Build release assets
        run: ./scripts/build-release.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" dist
      - name: Verify release assets
        run: ./tests/artifacts/release-assets.sh dist "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
