name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify peeled tag commit on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit=$(git rev-parse "$GITHUB_REF_NAME^{}")
          test "$tag_commit" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$tag_commit" origin/main
      - name: Build release assets
        run: ./scripts/build-release.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" dist
      - name: Verify release assets
        run: ./tests/artifacts/release-assets.sh dist "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
