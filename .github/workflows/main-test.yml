name: Main Test

# The main surface runs here, after a change has merged, rather than on every
# pull request. Its two operating systems took 22 to 38 minutes, and the strict
# up-to-date ruleset sent every other pull request back to rebase and wait after
# each merge. The cost is accepted: a regression can reach main before this
# detects it. A failure here is an immediate defect to fix forward or revert
# before any release is cut, and the release workflow refuses a commit that has
# no passing run.
#
# The main surface holds the entries that must not run per pull request: the
# quick gate, the integration suites, the end-to-end suites, and the
# vulnerability scan (HI-1). The pull-request gate keeps everything else.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Each main commit keeps its own result. The group is per commit, so a later
# push never cancels the run for an earlier one; a shared group would cancel
# every commit that waited behind the running one.
concurrency:
  group: main-test-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The macOS leg is the recorded physically-bound layer for the
        # darwin-tagged host code: the Linux leg cannot compile or exercise
        # those files, so only this leg proves them.
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run the main surface
        run: |
          set -eu
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:${PATH}"
          ./rhino gate run --surface main

  release-build:
    name: Release build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      # The Linux inventory is the reference the macOS rebuild must reproduce.
      - name: Build all supported assets
        run: ./scripts/build-release.sh v0.0.0 "$GITHUB_SHA" dist

      - name: Verify asset inventory
        run: ./tests/artifacts/release-assets.sh dist v0.0.0 "$GITHUB_SHA"

      - name: Record the checksum inventory
        id: inventory
        run: |
          cat dist/checksums.txt
          {
            echo "checksums<<EOF"
            cat dist/checksums.txt
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
    outputs:
      checksums: ${{ steps.inventory.outputs.checksums }}

  release-reproducibility:
    name: Release reproducibility
    # The archives must depend on the commit alone, not on the machine that
    # built them: macOS ships a different tar, gzip, and filesystem from the
    # Linux runner that publishes releases. Rebuilding the same commit here and
    # requiring the Linux job's checksums byte for byte proves it after every
    # merge, before a release tag relies on it.
    needs: [release-build]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build all supported assets
        run: ./scripts/build-release.sh v0.0.0 "$GITHUB_SHA" dist

      - name: Require the Linux checksum inventory
        env:
          LINUX_CHECKSUMS: ${{ needs.release-build.outputs.checksums }}
        run: printf '%s\n' "${LINUX_CHECKSUMS}" | diff -u - dist/checksums.txt
