name: PR Quality Gate

# Integration moved to worktree-to-pull-request, so the guarantees that used to
# rest on this workstation's Git hooks need a server-side mirror: a pull request
# can be opened from any checkout, including one whose hooks never ran.
#
# The gates themselves come only from the registry in `repo-config.yml`. The
# pull-request surface is split into jobs by level, and each job names its
# registry entries with `--entry`, so no job copies a gate's command and every
# pull-request entry runs in exactly one job (C1). The mixed-version leaf is an
# end-to-end layer (D20), so it runs in the e2e suite and not per pull request.
#
# Nothing here is wrapped in the guard, and here that is not a judgement call:
# HIPPO cannot guard HIPPO. The wrapper builds this same tool from the working
# tree, so a gate that ran under it would be arbitrated by the change under
# test. The local hooks run the gate directly for the same reason.
#
# Every action reference names a full commit SHA, with the release tag it was
# resolved from in a trailing comment. The version of each runtime and tool is
# recorded with its source in phase-5-hippo-workflow-versions.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The quick entry alone: typecheck, strict lint, the unit suites with -race,
  # and the static behaviour checks.
  test-quick:
    name: Test quick
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The head is checked out with its history, because the gate reads the
      # explicit base and head range from the commits themselves.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Node 24 is pinned to the resolved patch release, not the major line, so
      # a runner's cached image cannot move the formatter or the test runner.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run the quick gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:${PATH}"
          ./rhino gate run --surface pull-request --entry quick \
            --base "${BASE_SHA}" --head "${HEAD_SHA}"

  test-integration:
    name: Test integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run the integration target
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:${PATH}"
          ./rhino gate run --surface pull-request --entry test-integration \
            --base "${BASE_SHA}" --head "${HEAD_SHA}"

  # Every other pull-request entry: the public-safety screens, the commit and
  # message checks, the formatter replays, the repository documents and
  # governance, the hook transport tests, the architecture and contract suites,
  # the artifact checks, and the wiring rules.
  pull-request-checks:
    name: Pull-request checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run the pull-request checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          export PATH="${GITHUB_WORKSPACE}/node_modules/.bin:${PATH}"
          ./rhino gate run --surface pull-request \
            --entry public-safety-tree --entry public-safety-range \
            --entry public-safety-message --entry public-safety-tests \
            --entry format-staged --entry commit-message --entry shell-lint \
            --entry remote-dispatch-refusal --entry markdown-line-length \
            --entry repo-config --entry word-budget --entry quality-gates \
            --entry directory-map --entry harness-adapters --entry internal-links \
            --entry mermaid --entry worktree-layout --entry format-check \
            --entry hook-transport-tests --entry architecture-tests \
            --entry contract-tests --entry artifact-tests --entry gate-wiring \
            --base "${BASE_SHA}" --head "${HEAD_SHA}"

  # The pinned RHINO release, verified on a clean runner. Narrower than the rest
  # of the gate on purpose: an ordinary pull request pays nothing for a
  # consumer boundary it did not touch.
  consumer-bootstrap:
    name: Pinned RHINO bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Route on the pinned consumer boundary
        id: route
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          git fetch --no-tags origin "${BASE_REF}"
          changed=$(git diff --name-only FETCH_HEAD...HEAD -- \
            rhino rhino.lock ferret.lock shellcheck.lock '.github/workflows/pr-quality-gate.yml')
          if [ -n "${changed}" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      # The one condition a local hook, with its warm cache, can never observe:
      # a clean machine resolving the pinned release from nothing and verifying
      # its checksum before running it.
      - name: Verify the pinned bootstrap resolves and verifies
        if: steps.route.outputs.changed == 'true'
        run: ./rhino version

  release-build:
    name: Release build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      # A release tag is permanent, so the moment to discover that the asset
      # matrix no longer builds is before the change lands, not during the cut.
      - name: Build all supported assets
        run: ./scripts/build-release.sh v0.0.0 "$GITHUB_SHA" dist

      - name: Verify asset inventory
        run: ./tests/artifacts/release-assets.sh dist v0.0.0 "$GITHUB_SHA"

      - name: Record the checksum inventory
        id: inventory
        run: |
          cat dist/checksums.txt
          {
            echo "checksums<<EOF"
            cat dist/checksums.txt
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
    outputs:
      checksums: ${{ steps.inventory.outputs.checksums }}

  quality-gate:
    name: Quality gate
    # The single required status check. Branch protection names one context, so
    # adding or splitting a job above never means editing the ruleset -- and a
    # job that is added but forgotten here still cannot pass unnoticed, because
    # `needs` fails the aggregate when any dependency does.
    needs:
      [
        test-quick,
        test-integration,
        pull-request-checks,
        consumer-bootstrap,
        release-build,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every gate
        env:
          # A cancelled or skipped dependency is not a pass: only an explicit
          # success from every job may open the merge button.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -eu
          echo "Gate results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "A quality gate job did not succeed." >&2
              exit 1
            fi
          done
          echo "All quality gates passed."
