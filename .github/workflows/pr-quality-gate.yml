name: PR Quality Gate

# Integration moved to worktree-to-pull-request, so the guarantees that used to
# rest on this workstation's Git hooks need a server-side mirror: a pull request
# can be opened from any checkout, including one whose hooks never ran.
#
# This workflow replaces `ci.yml` rather than sitting beside it. Two workflows
# would mean two places to edit when a hook contract changes, and one of them
# would eventually be missed. Everything the retired workflow ran is here.
#
# Nothing here is wrapped in the guard, and here that is not a judgement call:
# HIPPO cannot guard HIPPO. The wrapper builds this same tool from the working
# tree, so a gate that ran under it would be arbitrated by the change under
# test. The local hooks run the gate directly for the same reason.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # `scripts/test.sh` runs this too, after merge in the main test workflow.
      # Named here because the pre-commit format gate only ever sees staged
      # paths, so formatting is the one hook contract with no independent
      # signal -- and a formatting failure should be legible in the job list
      # rather than found by reading a long test log.
      - name: Formatters and Prettier across the repository
        run: ./scripts/format-check.sh

  repository-contract:
    name: Repository contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # One typed lifecycle replay. Rhino derives every child command from the
      # registry and refuses a caller that supplies an incomplete or mutable
      # review range.
      - name: Repository policy under the pinned RHINO
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          ./rhino gate run --surface pull-request --base "$BASE_SHA" --head "$HEAD_SHA"

  consumer-bootstrap:
    name: Pinned RHINO bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Narrower than the rest of the gate on purpose: an ordinary pull request
      # pays nothing for a consumer boundary it did not touch.
      - name: Route on the pinned consumer boundary
        id: route
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          git fetch --no-tags origin "${BASE_REF}"
          changed=$(git diff --name-only FETCH_HEAD...HEAD -- \
            rhino rhino.lock '.github/workflows/pr-quality-gate.yml')
          if [ -n "${changed}" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      # The one condition a local hook, with its warm cache, can never observe:
      # a clean machine resolving the pinned release from nothing and verifying
      # its checksum before running it.
      - name: Verify the pinned bootstrap resolves and verifies
        if: steps.route.outputs.changed == 'true'
        run: ./rhino version

  mixed-version:
    # The one released-binary check that depends on the host's CPU count. The
    # released build subtracts a CPU before its cap, so a shared ledger can
    # disagree with the current build on hosts this runner size. The full suite
    # runs this same leaf after merge; here only the leaf runs, on this runner.
    name: Mixed-version compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Released v0.8.5 interoperability leaf
        run: ./tests/e2e/mixed-version.sh

  release-build:
    name: Release build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # A release tag is permanent, so the moment to discover that the asset
      # matrix no longer builds is before the change lands, not during the cut.
      - name: Build all supported assets
        run: ./scripts/build-release.sh v0.0.0 "$GITHUB_SHA" dist

      - name: Verify asset inventory
        run: ./tests/artifacts/release-assets.sh dist v0.0.0 "$GITHUB_SHA"

      - name: Record the checksum inventory
        id: inventory
        run: |
          cat dist/checksums.txt
          {
            echo "checksums<<EOF"
            cat dist/checksums.txt
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
    outputs:
      checksums: ${{ steps.inventory.outputs.checksums }}

  quality-gate:
    name: Quality gate
    # The single required status check. Branch protection names one context, so
    # adding or splitting a job below never means editing the ruleset -- and a
    # job that is added but forgotten here still cannot pass unnoticed, because
    # `needs` fails the aggregate when any dependency does.
    needs:
      [
        formatting,
        repository-contract,
        consumer-bootstrap,
        release-build,
        mixed-version,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every gate
        env:
          # A cancelled or skipped dependency is not a pass: only an explicit
          # success from every job may open the merge button.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -eu
          echo "Gate results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "A quality gate job did not succeed." >&2
              exit 1
            fi
          done
          echo "All quality gates passed."
